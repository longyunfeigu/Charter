appId: com.pi-ide.desktop
productName: Charter
copyright: Copyright © 2026
electronLanguages: [en, zh_CN]

directories:
  output: release
  buildResources: build-resources

asar: true

files:
  - package.json
  - apps/desktop-main/dist/**
  - apps/desktop-preload/dist/**
  - apps/agent-worker/dist/**
  - apps/desktop-renderer/dist/**
  - '!**/*.map'
  # node-pty is copied as a real runtime resource below. Loading its macOS
  # spawn-helper from app.asar.unpacked makes posix_spawn fail in packaged apps.
  - '!node_modules/node-pty/**'
  # ADR-0047: ssh2's optional native accelerator is excluded so packaged apps
  # always take ssh2's pure-JS fallback (no Electron ABI risk on any platform).
  - '!node_modules/cpu-features/**'
  - '!node_modules/nan/**'

asarUnpack:
  # The detached daemon is executed in ELECTRON_RUN_AS_NODE mode, which cannot
  # load its entry from inside app.asar.
  - 'apps/desktop-main/dist/terminal-daemon.cjs'
  - 'node_modules/@vscode/ripgrep/**'

# Both Electron Main and the run-as-node daemon reach this directory through
# normal Node module resolution. Keeping node-pty outside app.asar.unpacked is
# also required for its macOS spawn-helper to create a controlling PTY.
extraResources:
  - from: node_modules/node-pty
    to: node_modules/node-pty

npmRebuild: false

# M11-01: flip Electron fuses (RunAsNode is reserved for the detached terminal
# daemon; NODE_OPTIONS/inspect stay disabled, with asar integrity enforced).
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Required for future Developer ID notarization. Unsigned Preview builds use
  # an ad-hoc identity because scripts/package.mjs disables identity discovery.
  hardenedRuntime: true

win:
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  executableName: charter
  target:
    - target: tar.gz
      arch: [x64]
  category: Development
  artifactName: '${productName}-${version}-linux-preview.${ext}'

# `npm run package` still passes `--publish never`: GitHub Actions owns release
# creation. Keeping the provider here makes electron-builder emit the channel
# metadata consumed by signed macOS/Windows installations.
publish:
  provider: github
  owner: longyunfeigu
  repo: Charter
  # GitHub providers do not auto-detect prerelease channels. The macro expands
  # to beta/rc/etc. and falls back to `latest` for a stable SemVer.
  channel: '${channel}'
