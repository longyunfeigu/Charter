<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>提醒卡重设计 v2 · 动效三方向 — mock</title>
<link rel="stylesheet" href="../work-capture-directions/shared.css">
<style>
  .ms-variants { display: flex; align-items: center; gap: 4px; }
  .ms-variants button {
    padding: 5px 10px;
    border: 0;
    border-radius: 7px;
    background: rgba(246, 245, 241, 0.12);
    color: rgba(246, 245, 241, 0.75);
    font: 600 10px var(--font-ui);
  }
  .ms-variants button.on { background: #f6f5f1; color: #1b1a16; }
  .ms-variants .fire { margin-left: 8px; background: #e8e6e0; color: #1b1a16; font-weight: 700; }

  /* ── 共用卡片 ─────────────────────────────────────────────────────── */
  .ra-card {
    position: relative;
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 11px;
    width: min(500px, calc(100vw - 48px));
    padding: 14px 14px 13px;
    border: 1px solid color-mix(in srgb, var(--warning) 55%, var(--border));
    border-radius: var(--radius-card);
    background: var(--bg-card);
    box-shadow:
      0 0 0 0 color-mix(in srgb, var(--warning) 35%, transparent),
      var(--shadow-menu);
  }
  .ra-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-chip);
    background: var(--warning-bg);
    color: var(--warning);
  }
  .ra-copy { min-width: 0; display: grid; gap: 3px; }
  .ra-copy > span { color: var(--warning); font: 750 8px var(--font-ui); letter-spacing: 0.12em; }
  .ra-copy > strong { font: 600 14px/1.35 var(--font-display); }
  .ra-copy > small { color: var(--fg-muted); font-size: 9.5px; }
  .ra-actions { display: flex; align-items: center; gap: 5px; margin-top: 9px; grid-column: 2 / -1; }
  .ra-actions .btn { min-height: 26px; padding: 0 9px; font-size: 9.5px; }
  .ra-x {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--fg-faint);
  }
  .ra-x:hover { background: var(--bg-hover); color: var(--fg); }

  /* ── A · 弹入 + 心跳（Pop & Pulse）───────────────────────────────── */
  .ra-stack-a {
    position: fixed; top: 144px; left: 50%; z-index: 500;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transform: translateX(-50%);
  }
  .pop-in {
    animation: pop-in 520ms cubic-bezier(0.18, 1.2, 0.3, 1) both;
  }
  @keyframes pop-in {
    0% { opacity: 0; transform: translateY(-70px) scale(0.55); }
    55% { opacity: 1; transform: translateY(10px) scale(1.06); }
    78% { transform: translateY(-4px) scale(0.985); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 落地冲击波 */
  .pop-in::before {
    content: '';
    position: absolute;
    inset: -2px;
    border: 2px solid color-mix(in srgb, var(--warning) 65%, transparent);
    border-radius: inherit;
    opacity: 0;
    animation: shockwave 700ms ease-out 380ms;
    pointer-events: none;
  }
  @keyframes shockwave {
    0% { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.18, 1.5); }
  }
  /* 未处理期间每 4s 心跳一次：轻微上顶 + 光晕呼出（真实实现建议 10s 一次） */
  .heartbeat {
    animation: heartbeat 4s ease-in-out 1.4s infinite;
  }
  @keyframes heartbeat {
    0%, 14%, 100% {
      transform: none;
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 35%, transparent), var(--shadow-menu);
    }
    4% { transform: translateY(-5px) scale(1.015); }
    8% { transform: translateY(0) scale(1); }
    10% {
      box-shadow: 0 0 0 14px color-mix(in srgb, var(--warning) 0%, transparent), var(--shadow-menu);
    }
  }

  /* ── B · 闹钟摇铃（Ring & Shake）─────────────────────────────────── */
  .ra-stack-b {
    position: fixed; top: 144px; right: 20px; z-index: 500;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .swing-in {
    transform-origin: 50% -30px; /* 像挂在顶边的一根钉子上 */
    animation: swing-in 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  @keyframes swing-in {
    0% { opacity: 0; transform: translateY(-40px) rotate(8deg); }
    18% { opacity: 1; transform: translateY(0) rotate(7deg); }
    38% { transform: rotate(-5.5deg); }
    58% { transform: rotate(3.5deg); }
    76% { transform: rotate(-2deg); }
    90% { transform: rotate(1deg); }
    100% { transform: rotate(0); }
  }
  /* 未处理期间每 5s 再摇一轮，铃铛图标持续小幅摆动 */
  .re-shake { animation: re-shake 5s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1.6s infinite; transform-origin: 50% -30px; }
  @keyframes re-shake {
    0%, 24%, 100% { transform: rotate(0); }
    4% { transform: rotate(3.5deg); }
    9% { transform: rotate(-2.8deg); }
    14% { transform: rotate(1.8deg); }
    19% { transform: rotate(-0.9deg); }
  }
  .bell-rock { animation: bell-rock 1.8s ease-in-out infinite; transform-origin: 50% 15%; }
  @keyframes bell-rock {
    0%, 55%, 100% { transform: rotate(0); }
    62% { transform: rotate(9deg); }
    72% { transform: rotate(-8deg); }
    82% { transform: rotate(5deg); }
    90% { transform: rotate(-2.5deg); }
  }

  /* ── C · 夺焦降落（Takeover → Dock）──────────────────────────────── */
  .ra-dim {
    position: fixed; inset: 78px 0 0; z-index: 490;
    background: color-mix(in srgb, var(--bg-overlay) 70%, transparent);
    animation: dim-flash 1.9s ease-in-out both;
    pointer-events: none;
  }
  @keyframes dim-flash {
    0% { opacity: 0; }
    12% { opacity: 1; }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
  .ra-center {
    position: fixed; top: 34%; left: 50%; z-index: 500;
    animation: center-pop 480ms cubic-bezier(0.18, 1.25, 0.3, 1) both;
  }
  @keyframes center-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .ra-center.leave { animation: center-leave 420ms cubic-bezier(0.5, 0, 0.75, 0.4) both; }
  @keyframes center-leave {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + 42vw), calc(-50% - 26vh)) scale(0.15); }
  }
  .ra-pill {
    position: fixed; top: 144px; right: 20px; z-index: 500;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border: 1px solid color-mix(in srgb, var(--warning) 55%, var(--border));
    border-radius: 999px;
    background: var(--bg-card);
    box-shadow: var(--shadow-menu);
    color: var(--fg);
    font: 650 10.5px var(--font-ui);
    animation: pop-in 380ms cubic-bezier(0.18, 1.2, 0.3, 1) both, pill-throb 2.4s ease-in-out 1s infinite;
  }
  @keyframes pill-throb {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 40%, transparent), var(--shadow-menu); }
    50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--warning) 0%, transparent), var(--shadow-menu); }
  }
  .ra-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); animation: ra-pulse 1.4s ease-in-out infinite; }
  @keyframes ra-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .ra-note {
    position: fixed; left: 50%; bottom: 22px; z-index: 480;
    max-width: 660px; padding: 9px 14px;
    border: 1px dashed var(--border-strong); border-radius: 11px;
    background: var(--bg-card); color: var(--fg-muted);
    font: 10.5px/1.6 var(--font-ui);
    transform: translateX(-50%);
  }
  .ra-note b { color: var(--fg); }
  .no-anim { animation: none !important; }
</style>
</head>
<body>
<script src="../work-capture-directions/shared.js"></script>
<script>
const M = CM;
M.mountShell({ current: '', title: '应用内提醒卡 v2 · 动效三方向', note: '弹出有物理感，落定后持续“闹”到被处理为止', demo: false });

const nav = document.querySelector('.mock-strip nav');
nav.innerHTML = `
  <span class="ms-variants">
    <button data-v="a" class="on">A · 弹入+心跳</button>
    <button data-v="b">B · 闹钟摇铃</button>
    <button data-v="c">C · 夺焦降落</button>
    <button data-v="d">★ A+B 组合</button>
    <button class="fire" id="fire">⏰ 触发一条提醒</button>
    <button id="snd" title="到期音效（模拟，可关）">🔇</button>
  </span>`;

const REMINDERS = [
  { title: 'Approve Monday partner announcement', msg: 'Partner announcement still needs final approval.' },
  { title: 'Reply to the enterprise security questionnaire', msg: 'This work item needs your attention.' },
  { title: 'Renew the SOC 2 evidence pack', msg: 'Renewal window opens Sep 1.' },
];
let variant = 'a';
let queue = [];
let soundOn = false;

/* 到期音效（两声短促上行提示音，非机器闹铃）——真实实现走可关的设置项 */
document.getElementById('snd').onclick = (event) => {
  soundOn = !soundOn;
  event.currentTarget.textContent = soundOn ? '🔔' : '🔇';
};
function chime() {
  if (!soundOn) return;
  const ctx = new AudioContext();
  [[880, 0], [1174.7, 0.14]].forEach(([freq, at]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime + at);
    gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + at + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + at + 0.22);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + at);
    osc.stop(ctx.currentTime + at + 0.25);
  });
}

nav.querySelectorAll('[data-v]').forEach((button) => {
  button.onclick = () => {
    nav.querySelectorAll('[data-v]').forEach((candidate) => candidate.classList.remove('on'));
    button.classList.add('on');
    variant = button.dataset.v;
    reset();
    note();
    fire();
  };
});
document.getElementById('fire').onclick = () => fire();

let hosts = [];
function reset() {
  hosts.forEach((el) => el.remove());
  hosts = [];
  queue = [];
}
function mount(el) {
  document.body.appendChild(el);
  hosts.push(el);
  return el;
}
function actions(onClose) {
  const row = M.el(`<div class="ra-actions">
    <button class="btn primary">View task</button>
    <button class="btn">Snooze 10m</button>
    <button class="btn">Snooze 1h</button>
  </div>`);
  row.querySelectorAll('button').forEach((button) => (button.onclick = onClose));
  return row;
}
function card(reminder, onClose, iconClass = '') {
  const el = M.el(`<article class="ra-card">
    <span class="ra-icon ${iconClass}">${M.ic('bell', 17)}</span>
    <div class="ra-copy">
      <span>WORK REMINDER · DUE NOW</span>
      <strong>${reminder.title}</strong>
      <small>${reminder.msg}</small>
    </div>
    <button class="ra-x">${M.ic('x', 13)}</button>
  </article>`);
  el.querySelector('.ra-x').onclick = onClose;
  el.querySelector('.ra-copy').appendChild(actions(onClose));
  return el;
}

let stackA = null;
let stackB = null;
let pill = null;
function fire() {
  const reminder = REMINDERS[queue.length % REMINDERS.length];
  queue.push(reminder);
  chime();

  if (variant === 'a') {
    if (!stackA || !stackA.isConnected) stackA = mount(M.el('<div class="ra-stack-a"></div>'));
    const el = card(reminder, () => el.remove());
    el.classList.add('pop-in');
    // 弹入结束后进入心跳循环，直到被处理
    setTimeout(() => el.classList.add('heartbeat'), 620);
    stackA.appendChild(el);
  } else if (variant === 'b') {
    if (!stackB || !stackB.isConnected) stackB = mount(M.el('<div class="ra-stack-b"></div>'));
    const el = card(reminder, () => el.remove(), 'bell-rock');
    el.classList.add('swing-in');
    setTimeout(() => {
      el.classList.remove('swing-in');
      el.classList.add('re-shake');
    }, 1150);
    stackB.appendChild(el);
  } else if (variant === 'd') {
    // ★ A+B：B 的位置/挂钉入场/铃铛性格 + A 的心跳持续态（低疲劳）
    if (!stackB || !stackB.isConnected) stackB = mount(M.el('<div class="ra-stack-b"></div>'));
    const el = card(reminder, () => el.remove(), 'bell-rock');
    el.classList.add('swing-in');
    setTimeout(() => {
      el.classList.remove('swing-in');
      el.classList.add('heartbeat');
    }, 1150);
    stackB.appendChild(el);
  } else {
    // 夺焦：压暗一切 → 中心弹出 → 1.4s 后飞向右上收成脉动胶囊
    const dim = mount(M.el('<div class="ra-dim"></div>'));
    const center = mount(M.el('<div class="ra-center"></div>'));
    const el = card(reminder, () => {
      center.remove();
      dim.remove();
    });
    center.appendChild(el);
    setTimeout(() => {
      if (!center.isConnected) return;
      center.classList.add('leave');
      setTimeout(() => {
        center.remove();
        dim.remove();
        if (!pill || !pill.isConnected) {
          pill = mount(
            M.el(`<button class="ra-pill"><i></i>${M.ic('clock', 12)} <b class="ra-n">1</b>&nbsp;reminder due</button>`),
          );
          pill.onclick = () => {
            pill.remove();
            queue = [];
          };
        } else {
          pill.querySelector('.ra-n').textContent = String(queue.length);
          pill.nextSibling; // no-op
        }
      }, 430);
    }, 1400);
  }
}

const NOTES = {
  a: '<b>A · 弹入 + 心跳</b>：520ms 弹簧曲线砸下来（过冲 6%），落地一圈琥珀冲击波；之后每 4s 心跳一次（上顶 5px + 光晕呼出），闹到你处理为止。演示节奏 4s，真实建议 10s。',
  b: '<b>B · 闹钟摇铃</b>：像挂在顶边钉子上甩进来（±8° 阻尼摆），铃铛图标持续摇摆；每 5s 整卡再摇一轮——最“闹钟”的性格。',
  c: '<b>C · 夺焦降落</b>：到期瞬间整个界面压暗、卡片在屏幕中心弹出——1.4s 内你不可能没看见；然后自动飞向右上收成一颗持续脉动的胶囊，不再挡路。最霸道，也最不打扰后续操作。',
  d: '<b>★ A+B 组合</b>：入场和铃铛用 B（右上挂钉摆入、铃铛持续摇——性格），持续态换成 A 的心跳（每 4s 上顶+光晕，演示节奏；真实建议 10s）——把“整卡反复旋转看多了会烦”这个 B 的弱点换掉，闹钟感保留。',
};
let noteEl = null;
function note() {
  noteEl?.remove();
  noteEl = M.el(`<div class="ra-note">${NOTES[variant]}<br>右上 🔇 可开到期音效（模拟）。所有动效在处理（View/Snooze/✗）后立即停止。</div>`);
  document.body.appendChild(noteEl);
}
note();
fire();
</script>
</body>
</html>
