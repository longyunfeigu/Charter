<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charter · External Work Inbox</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #191a18;
      --ink-2: #2a2b28;
      --paper: #fbfaf6;
      --paper-2: #f4f1e9;
      --paper-3: #ede9df;
      --line: #d8d3c8;
      --line-strong: #bcb6aa;
      --muted: #737168;
      --muted-2: #97938a;
      --blue: #1f62c6;
      --blue-soft: #e8f0fc;
      --green: #267a4a;
      --green-soft: #e6f3e9;
      --orange: #a8581b;
      --orange-soft: #faeddc;
      --red: #b53e35;
      --red-soft: #f8e7e4;
      --purple: #6853a7;
      --purple-soft: #eeebf8;
      --shadow: 0 18px 55px rgba(29, 27, 22, .18), 0 2px 8px rgba(29, 27, 22, .08);
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: Iowan Old Style, Charter, Georgia, serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #d7d2c8;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    svg { display: block; }
    [hidden] { display: none !important; }

    .app {
      width: 100vw;
      height: 100vh;
      min-width: 980px;
      min-height: 660px;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      background: var(--paper);
    }

    .titlebar {
      display: grid;
      grid-template-columns: 244px 1fr 280px;
      align-items: center;
      height: 42px;
      border-bottom: 1px solid #343532;
      background: #20211f;
      color: #f5f3ec;
      user-select: none;
    }

    .window-side,
    .title-actions,
    .title-context { display: flex; align-items: center; }
    .window-side { gap: 15px; padding-left: 14px; }
    .traffic { display: flex; gap: 7px; }
    .traffic i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #ef6a5d; }
    .traffic i:nth-child(2) { background: #e9bd4e; }
    .traffic i:nth-child(3) { background: #61c454; }
    .brand { font-weight: 730; letter-spacing: .08em; font-size: 11px; }
    .brand span { color: #81aeea; }

    .title-context {
      justify-content: center;
      gap: 7px;
      min-width: 0;
      color: #bdbdb6;
      font-size: 12px;
    }
    .title-context strong { color: #f5f3ec; font-weight: 620; }
    .title-context .slash { color: #5f605c; }
    .branch-pill {
      display: inline-flex; align-items: center; gap: 5px;
      max-width: 180px;
      padding: 4px 7px;
      border: 1px solid #454642;
      border-radius: 6px;
      color: #cdccc5;
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-actions { justify-content: flex-end; gap: 7px; padding-right: 11px; }
    .title-button {
      height: 27px;
      padding: 0 9px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid #454642;
      border-radius: 6px;
      background: #292a27;
      color: #d8d7d0;
      font-size: 11px;
    }
    .key {
      padding: 1px 4px;
      border: 1px solid #555651;
      border-radius: 4px;
      color: #aaa9a2;
      font: 9px var(--mono);
    }

    .workspace {
      display: grid;
      grid-template-columns: 74px 322px minmax(0, 1fr);
      min-height: 0;
    }

    .activity-bar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #262724;
      color: #a6a69e;
      border-right: 1px solid #383935;
    }

    .activity-nav { padding: 7px 0; }
    .activity-bottom { margin-top: auto; padding: 7px 0 8px; border-top: 1px solid #3b3c38; }
    .activity-item {
      position: relative;
      width: 100%;
      height: 49px;
      padding: 5px 0 4px;
      border: 0;
      background: transparent;
      color: inherit;
      display: grid;
      place-items: center;
      gap: 2px;
    }
    .activity-item:hover { color: #f0efe9; background: #2e2f2c; }
    .activity-item.active { color: #f9f8f2; background: #30312e; }
    .activity-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: #6b9ee3;
    }
    .activity-item .icon { width: 19px; height: 19px; }
    .activity-item span { font-size: 9px; letter-spacing: .01em; }
    .activity-item .badge-dot {
      position: absolute;
      top: 7px;
      right: 15px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: #d2623b;
      color: white;
      font-size: 8px;
      font-weight: 700;
      box-shadow: 0 0 0 2px #262724;
    }

    .work-rail {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      background: var(--paper-2);
      border-right: 1px solid var(--line);
    }

    .rail-head { padding: 17px 16px 11px; }
    .rail-title-row { display: flex; align-items: center; justify-content: space-between; }
    .rail-title {
      margin: 0;
      font: 600 23px/1.1 var(--display);
      letter-spacing: -.025em;
    }
    .rail-tools { display: flex; gap: 5px; }
    .icon-button {
      width: 29px;
      height: 29px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: #56564f;
    }
    .icon-button:hover { border-color: var(--line-strong); background: white; }
    .icon-button .icon { width: 15px; height: 15px; }
    .rail-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 11px; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ebe7dd;
      padding: 3px;
    }
    .tab {
      min-width: 0;
      height: 28px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #64635c;
      font-size: 10px;
      font-weight: 630;
      white-space: nowrap;
    }
    .tab span { margin-left: 3px; color: #929088; font-family: var(--mono); font-size: 9px; }
    .tab.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(35, 32, 26, .10); }
    .tab.active span { color: var(--blue); }

    .rail-filter { padding: 0 12px 10px; }
    .search-wrap { position: relative; }
    .search-wrap .icon {
      position: absolute;
      left: 9px;
      top: 8px;
      width: 14px;
      height: 14px;
      color: var(--muted-2);
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 31px;
      padding: 0 31px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #faf8f3;
      color: var(--ink);
      font-size: 11px;
    }
    .search::placeholder { color: #9a978e; }
    .clear-search {
      position: absolute;
      right: 5px;
      top: 4px;
      width: 23px;
      height: 23px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
    }
    .filter-row { display: flex; gap: 6px; margin-top: 7px; }
    .compact-select {
      min-width: 0;
      height: 28px;
      flex: 1;
      padding: 0 25px 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: #5e5c55;
      font-size: 10px;
    }
    .import-button {
      height: 28px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 10px;
      font-weight: 650;
    }
    .import-button .icon { width: 13px; height: 13px; }

    .work-list {
      min-height: 0;
      overflow: auto;
      padding: 0 8px 18px;
      scrollbar-width: thin;
      scrollbar-color: #c7c2b7 transparent;
    }
    .group-head {
      height: 27px;
      padding: 9px 8px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #858279;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .group-head span:last-child { font: 9px var(--mono); color: #a29f96; }
    .work-item {
      width: 100%;
      min-height: 76px;
      padding: 10px 10px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr);
      gap: 8px;
    }
    .work-item:hover { background: rgba(255, 255, 255, .55); }
    .work-item.selected {
      background: #fff;
      border-color: #c9c5bc;
      box-shadow: 0 1px 3px rgba(36, 33, 27, .06);
    }
    .source-mark {
      width: 25px;
      height: 25px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 10px;
      color: #fff;
      background: #242522;
    }
    .source-mark.linear { background: #5f52a3; }
    .source-mark.charter { background: #2d7950; }
    .work-item-main { min-width: 0; }
    .item-top, .item-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .item-ref {
      min-width: 0;
      color: #7b786f;
      font: 9px var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .time { flex: none; color: #aaa69d; font-size: 9px; }
    .item-title {
      margin-top: 5px;
      color: #262724;
      font-size: 11px;
      font-weight: 635;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-foot { margin-top: 7px; justify-content: flex-start; }
    .mini-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 17px;
      padding: 0 6px;
      border-radius: 9px;
      background: var(--paper-3);
      color: #65635c;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .mini-status.ready { background: var(--blue-soft); color: #285b9f; }
    .mini-status.running { background: var(--orange-soft); color: #955016; }
    .mini-status.review { background: var(--purple-soft); color: var(--purple); }
    .mini-status.done, .mini-status.posted { background: var(--green-soft); color: var(--green); }
    .mini-status.blocked { background: var(--red-soft); color: var(--red); }
    .mini-status .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .item-meta { color: #939087; font-size: 9px; }

    .rail-foot {
      min-height: 44px;
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #76736b;
      font-size: 9px;
      background: rgba(246, 243, 235, .96);
    }
    .sync { display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #49a26c; box-shadow: 0 0 0 3px #dcecdf; }
    .manage-link { border: 0; background: transparent; color: var(--blue); font-size: 9px; }

    .main-surface {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--paper);
    }
    .detail-head {
      min-height: 126px;
      padding: 21px 28px 17px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 246, .98);
    }
    .detail-kicker { display: flex; align-items: center; gap: 7px; color: #747169; font-size: 10px; }
    .detail-kicker .source-mark { width: 19px; height: 19px; border-radius: 5px; font-size: 8px; }
    .breadcrumb-arrow { color: #aaa69d; }
    .detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-top: 9px; }
    .detail-title-wrap { min-width: 0; }
    .detail-title {
      margin: 0;
      max-width: 830px;
      font: 560 27px/1.14 var(--display);
      letter-spacing: -.025em;
    }
    .detail-meta { margin-top: 9px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: #858178; font-size: 10px; }
    .meta-sep { color: #c2beb5; }
    .header-actions { display: flex; gap: 7px; flex: none; padding-top: 2px; }
    .button {
      min-height: 32px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: #34342f;
      font-size: 10px;
      font-weight: 660;
    }
    .button:hover { border-color: #8f8b82; }
    .button.primary { border-color: var(--ink); background: var(--ink); color: #fff; }
    .button.primary:hover { background: #30312d; }
    .button.blue { border-color: var(--blue); background: var(--blue); color: #fff; }
    .button.danger { border-color: #d5a19b; color: var(--red); background: #fff9f8; }
    .button.ghost { border-color: transparent; background: transparent; color: #66645d; }
    .button .icon { width: 14px; height: 14px; }

    .detail-body {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #c7c2b7 transparent;
    }
    .body-inner { padding: 22px 28px 34px; }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(430px, 1fr) 355px;
      gap: 20px;
      align-items: start;
      max-width: 1180px;
      margin: 0 auto;
    }
    .column { display: grid; gap: 14px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .card.soft { background: #f8f6f0; }
    .card-head {
      min-height: 44px;
      padding: 12px 15px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #e6e2d9;
    }
    .card-title { margin: 0; font-size: 11px; font-weight: 740; letter-spacing: .01em; }
    .card-caption { color: var(--muted); font-size: 9px; }
    .card-body { padding: 15px; }
    .prose { color: #45443f; font-size: 12px; line-height: 1.6; }
    .prose p { margin: 0 0 10px; }
    .prose p:last-child { margin-bottom: 0; }
    .quote {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-left: 3px solid #b9cbe7;
      background: #f4f7fb;
      color: #565853;
      font-size: 11px;
      line-height: 1.5;
    }
    .labels { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 13px; }
    .label {
      height: 20px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      border-radius: 10px;
      background: var(--paper-3);
      color: #64625a;
      font: 9px var(--mono);
    }
    .label.blue { background: var(--blue-soft); color: #2d5f9d; }
    .label.red { background: var(--red-soft); color: #9c443d; }
    .label.green { background: var(--green-soft); color: var(--green); }

    .context-list { display: grid; gap: 0; }
    .context-row {
      min-height: 43px;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #ece8e0;
    }
    .context-row:last-child { border-bottom: 0; }
    .context-icon {
      width: 25px;
      height: 25px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #65635c;
      background: #f0ede6;
    }
    .context-icon .icon { width: 13px; height: 13px; }
    .context-name { display: block; color: #393a36; font-size: 10px; font-weight: 650; }
    .context-note { display: block; margin-top: 2px; color: #939087; font-size: 9px; }
    .context-state { color: var(--green); font-size: 9px; font-weight: 650; }

    .comment {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr);
      gap: 9px;
      padding: 11px 0;
      border-bottom: 1px solid #ece8e0;
    }
    .comment:last-child { border-bottom: 0; padding-bottom: 0; }
    .avatar {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ded8cc;
      color: #514e47;
      font-size: 9px;
      font-weight: 800;
    }
    .comment-head { display: block; color: #4d4c46; font-size: 9px; font-weight: 700; }
    .comment-head span { margin-left: 5px; color: #9a978e; font-weight: 450; }
    .comment-body { display: block; margin-top: 4px; color: #68665f; font-size: 10px; line-height: 1.45; }

    .launch-card { overflow: hidden; }
    .launch-intro {
      padding: 14px 15px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-bottom: 1px solid #e5e1d8;
      background: #f5f8fc;
    }
    .mapping-mark {
      width: 29px;
      height: 29px;
      flex: none;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .mapping-mark .icon { width: 15px; height: 15px; }
    .launch-intro strong { display: block; font-size: 11px; }
    .launch-intro p { margin: 3px 0 0; color: #74736c; font-size: 9px; line-height: 1.45; }
    .launch-body { padding: 14px 15px; }
    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #66645d;
      font-size: 9px;
      font-weight: 690;
    }
    .field-label em { color: var(--green); font-style: normal; font-weight: 620; }
    .control {
      width: 100%;
      min-height: 33px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfaf7;
      color: #31322f;
      font-size: 10px;
    }
    textarea.control { min-height: 78px; resize: vertical; line-height: 1.45; }
    .path-control { font-family: var(--mono); font-size: 9px; }
    .repo-line {
      min-height: 36px;
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfaf7;
    }
    .repo-icon {
      width: 21px;
      height: 21px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: #e8eee9;
      color: var(--green);
    }
    .repo-icon .icon { width: 12px; height: 12px; }
    .repo-main { min-width: 0; flex: 1; }
    .repo-name { display: block; font: 9px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repo-path { display: block; margin-top: 2px; color: #98958c; font: 8px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .confidence { color: var(--green); font-size: 8px; font-weight: 720; }
    .pipeline {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .pipeline-step {
      min-width: 0;
      min-height: 46px;
      padding: 7px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f7f5ef;
      text-align: center;
      color: #575650;
      font-size: 8px;
      line-height: 1.35;
    }
    .pipeline-step b { display: block; color: #33342f; font-size: 9px; }
    .launch-foot { padding: 12px 15px; border-top: 1px solid #e5e1d8; background: #f8f6f1; }
    .launch-foot .button { width: 100%; height: 36px; }
    .foot-note { margin-top: 7px; color: #98958c; font-size: 8px; line-height: 1.45; text-align: center; }

    .check-list { display: grid; gap: 8px; }
    .check-row { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; align-items: start; color: #55544e; font-size: 10px; line-height: 1.4; }
    .check-row input { width: 14px; height: 14px; margin: 0; accent-color: var(--blue); }

    .running-card { border-color: #d8b78f; background: #fffaf3; }
    .running-top { padding: 16px; display: flex; gap: 11px; align-items: flex-start; }
    .running-pulse {
      width: 31px;
      height: 31px;

    .metric-note { margin-top: 2px; color: #929088; font-size: 8px; }

      align-items: center;
      gap: 10px;

    .diff-stat { display: flex; gap: 5px; font: 9px var(--mono); }
    .plus { color: var(--green); }
    .minus { color: var(--red); }

    .verification-row {
      min-height: 48px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #ece8e0;

    .verification-row:last-child { border-bottom: 0; }

    .verify-name { font-size: 10px; font-weight: 660; }
    .verify-command { margin-top: 2px; color: #97948b; font: 8px var(--mono); }
    .verify-result { color: var(--green); font: 9px var(--mono); font-weight: 700; }

    .evidence-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #f7f5f0;

    .shot-window { height: 100%; border: 1px solid #bdb9b0; border-radius: 3px; background: #fdfcf8; overflow: hidden; }
    .shot-bar { height: 10px; background: #2a2b28; }
    .shot-body { display: grid; grid-template-columns: 19px 1fr; height: calc(100% - 10px); }
    .shot-rail { background: #f0ede5; border-right: 1px solid #d7d2c8; }
    .shot-lines { padding: 7px 6px; }

    .shot-lines i:nth-child(2) { width: 58%; background: #9fbbe2; }
    .shot-lines i:nth-child(3) { width: 72%; }

    .log-preview { height: 100%; border-radius: 3px; padding: 8px; background: #f9f7f1; border: 1px solid #c9c5bc; font: 6px/1.6 var(--mono); color: #68665f; }
    .evidence-info { padding: 7px 8px; }
    .evidence-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; font-weight: 680; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice {

      background: #fff;

        if (state.modal === 'import') {
          layer.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head"><div><div class="modal-kicker">External work</div><h2 class="modal-title" id="modal-title">Import from a URL</h2><p class="modal-copy">Paste a GitHub Issue or Linear Issue. Charter resolves its Project and repository before any work starts.</p></div><button type="button" class="icon-button" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
            <form id="import-form"><div class="modal-body"><div class="field"><label class="field-label" for="import-url">Issue URL</label><input class="control path-control" id="import-url" name="url" placeholder="https://github.com/owner/repo/issues/128" value="${escapeHtml(state.importUrl)}" autofocus /></div><div class="quote">Imports are read-only. Charter will show the exact Project, repository, and branch before creating a Session or Mission.</div></div><div class="modal-foot"><span class="card-caption">GitHub and Linear connections are healthy</span><div class="modal-foot-right"><button type="button" class="button" data-action="close-modal">Cancel</button><button type="submit" class="button primary">Resolve issue</button></div></div></form>
          </div>`;
        } else if (state.modal === 'start') {
          const item = currentItem();
          const draft = state.startDraft;
          layer.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head"><div><div class="modal-kicker">Final check</div><h2 class="modal-title" id="modal-title">Start work from ${escapeHtml(item.ref)}</h2><p class="modal-copy">This creates local work only. Nothing will be posted back to ${sourceName(item.source)}.</p></div><button type="button" class="icon-button" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
            <form id="start-form"><div class="modal-body"><div class="form-grid">
              <div class="field"><label class="field-label" for="start-project">Charter Project</label><select class="control" id="start-project" name="project"><option ${draft.project === 'Charter' ? 'selected' : ''}>Charter</option><option ${draft.project === 'Marketing website' ? 'selected' : ''}>Marketing website</option></select></div>
              <div class="field"><label class="field-label" for="start-branch">Base branch</label><input class="control path-control" id="start-branch" name="branch" value="${escapeHtml(draft.branch)}" /></div>
              <div class="field span-2"><label class="field-label" for="start-repo">Local repository</label><input class="control path-control" id="start-repo" name="repo" value="${escapeHtml(draft.path)}" /></div>
              <div class="field span-2"><div class="field-label">Execution shape</div><div class="choice-grid"><label class="choice"><input type="radio" name="shape" value="mission" ${draft.shape === 'mission' ? 'checked' : ''}/><strong>Mission · recommended</strong><p>Durable multi-agent work with implementation, verification, and independent review.</p></label><label class="choice"><input type="radio" name="shape" value="session" ${draft.shape === 'session' ? 'checked' : ''}/><strong>Single Session</strong><p>One agent in one Session. Best for a small, obvious change.</p></label></div></div>
              <div class="field span-2"><label class="field-label" for="start-acceptance"><span>Acceptance criteria</span><span>Editable before start</span></label><textarea class="control" id="start-acceptance" name="acceptance">${escapeHtml(draft.acceptance)}</textarea></div>
            </div></div><div class="modal-foot"><span class="card-caption">A new isolated worktree will be created.</span><div class="modal-foot-right"><button type="button" class="button" data-action="close-modal">Cancel</button><button type="submit" class="button primary">${icon('mission')} Start Mission</button></div></div></form>
          </div>`;
        } else if (state.modal === 'post') {
          const item = currentItem();
          layer.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head"><div><div class="modal-kicker">External write preview</div><h2 class="modal-title" id="modal-title">Post update to ${sourceName(item.source)}</h2><p class="modal-copy">This is the exact payload Charter will publish to ${escapeHtml(item.ref)}.</p></div><button type="button" class="icon-button" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
            <div class="modal-body"><div class="preview-note"><h4>Implementation complete · Evidence Pack</h4><p>Terminal transcript evidence is now captured, redacted, and retained after its Session closes.</p><ul><li><strong>Change:</strong> 3 files, <code>+128 −31</code></li><li><strong>Verification:</strong> 14/14 checks and 3/3 Electron E2E runs passed</li><li><strong>Review:</strong> no critical or major findings</li><li><strong>Evidence:</strong> UI screenshot, test log, 9-second interaction trace</li></ul><p style="margin-bottom:0">Mission: <code>${escapeHtml(item.mission || 'M-1042')}</code> · Commit: <code>8f42c6a</code></p></div><div class="quote">After publishing, Charter records this exact payload and the source response in the Mission audit log.</div></div>
            <div class="modal-foot"><span class="card-caption">One comment will be created. No PR yet.</span><div class="modal-foot-right"><button type="button" class="button" data-action="close-modal">Cancel</button><button type="button" class="button primary" data-action="confirm-post">${icon('external')} Post update</button></div></div>
          </div>`;
        }
        requestAnimationFrame(() => {
          const focusable = layer.querySelector('[autofocus], input, select, textarea, button');
          if (focusable) focusable.focus();
        });
      }

      function selectTab(tab) {
        state.activeTab = tab;
        state.query = '';
        state.source = 'all';
        const first = state.items.find(item => item.bucket === tab);
        if (first) state.selectedId = first.id;
        renderRail();
        renderMain();
      }

      function openStart() {
        const item = currentItem();
        state.startDraft = {
          project: item.localProject,
          branch: item.branch,
          path: item.path,
          shape: 'mission',
          acceptance: (item.acceptance || []).map(text => `• ${text}`).join('\n')
        };
        state.modal = 'start';
        renderModal();
      }

      function showToast(message) {
        const toast = document.querySelector('#toast');
        toast.innerHTML = `${icon('check')}<span>${escapeHtml(message)}</span>`;
        toast.hidden = false;
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }

      document.addEventListener('click', (event) => {
        const tab = event.target.closest('[data-tab]');
        if (tab) { selectTab(tab.dataset.tab); return; }
        const selection = event.target.closest('[data-select]');
        if (selection) { state.selectedId = selection.dataset.select; renderList(); renderMain(); return; }
        const activity = event.target.closest('[data-activity]');
        if (activity && activity.dataset.activity !== 'Work') { showToast(`${activity.dataset.activity} is outside this focused Work prototype.`); return; }
        const actionEl = event.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;
        if (action === 'import') { state.modal = 'import'; renderModal(); }
        else if (action === 'close-modal') { state.modal = null; renderModal(); }
        else if (action === 'clear-search') { state.query = ''; document.querySelector('#work-search').value = ''; actionEl.hidden = true; renderList(); }
        else if (action === 'refresh') { showToast('GitHub and Linear are up to date.'); }
        else if (action === 'start-mission') { openStart(); }
        else if (action === 'post-preview') { state.modal = 'post'; renderModal(); }
        else if (action === 'confirm-post') {
          const item = currentItem(); item.status = 'posted'; state.modal = null; renderModal(); renderRail(); renderMain(); showToast(`Update posted to ${item.ref}.`);
        }
        else if (action === 'approve-attention') {
          const item = currentItem(); item.bucket = 'review'; item.status = 'posted'; state.activeTab = 'review'; state.selectedId = item.id; renderRail(); renderMain(); showToast('Update approved and posted.');
        }
        else if (action === 'keep-local') { showToast('Evidence Pack kept local. No external update was posted.'); }
        else if (action === 'copy-mission') { showToast('Mission ID copied: M-1047'); }
        else if (action === 'open-mission') { showToast('Mission detail would open in the main surface.'); }
        else if (action === 'open-source') { showToast('Source issue would open in your connected account.'); }
        else if (action === 'locate-repo') { showToast('Repository picker would open here.'); }
        else if (action === 'edit-mapping') { showToast('Mapping rule is editable from Project settings.'); }
        else if (action === 'manage-connections') { showToast('GitHub and Linear connection settings would open.'); }
        else { showToast('Prototype interaction acknowledged.'); }
      });

      document.addEventListener('input', (event) => {
        if (event.target.id === 'work-search') {
          state.query = event.target.value;
          const clear = document.querySelector('.clear-search');
          if (clear) clear.hidden = !state.query;
          renderList();
        }
      });

      document.addEventListener('change', (event) => {
        if (event.target.id === 'source-filter') { state.source = event.target.value; renderList(); }
      });

      document.addEventListener('submit', (event) => {
        event.preventDefault();
        if (event.target.id === 'import-form') {
          const url = new FormData(event.target).get('url').trim();
          if (!url) { showToast('Paste a GitHub or Linear issue URL first.'); return; }
          const isLinear = url.toLowerCase().includes('linear');
          const id = `imported-${Date.now()}`;
          state.items.splice(3, 0, {
            id, bucket: 'incoming', project: 'CHARTER', source: isLinear ? 'linear' : 'github', ref: isLinear ? 'CHARTER-509' : 'edy/charter · #209', time: 'now',
            title: 'Imported external work item', status: 'ready', meta: 'new · mapping confirmed', author: 'external', created: 'Just now', repo: 'edy/charter', localProject: 'Charter',
            path: '/Users/edy/git/charter-test', branch: 'master', confidence: '98% match', labels: ['imported'],
            description: 'This issue was resolved from the URL you pasted. The source body, comments, and attachments are ready to carry into a Mission.',
            quote: url, comments: [], acceptance: ['Confirm the requested behavior', 'Add focused verification']
          });
          state.activeTab = 'incoming'; state.selectedId = id; state.query = ''; state.source = 'all'; state.modal = null; state.importUrl = '';
          renderModal(); renderRail(); renderMain(); showToast('Issue imported and mapped to Charter.');
        }
        if (event.target.id === 'start-form') {
          const form = new FormData(event.target);
          const item = currentItem();
          item.localProject = form.get('project'); item.branch = form.get('branch'); item.path = form.get('repo'); item.status = 'running'; item.mission = 'M-1047'; item.meta = 'M-1047 · 2 active';
          state.modal = null; renderModal(); renderRail(); renderMain(); showToast(`Mission M-1047 started from ${item.ref}.`);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.modal) { state.modal = null; renderModal(); }
      });

      renderRail();
      renderMain();
      renderModal();
      window.__mockReady = true;
      window.__mockState = state;
    })();
  </script>
</body>
</html>
